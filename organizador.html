<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#EEEBE2;
    --paper-dim:#E2DECF;
    --ink:#1F2A33;
    --ink-soft:#5B6672;
    --line:#C9C2AE;
    --gold:#C8961E;
    --teal:#2F6F6B;
    --rust:#B5533C;
    --plum:#6B4E71;
    --slate:#3E5C76;
    --olive:#6E7F3F;
    --danger:#B5533C;
    --radius:10px;
    --shadow:0 1px 0 rgba(31,42,51,0.06), 0 8px 20px -12px rgba(31,42,51,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, transparent 0 39px, rgba(31,42,51,0.035) 39px 40px),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Fraunces', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Setup gate ---------- */
  #setup{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .setup-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 32px;
    max-width:380px;
    width:100%;
    text-align:left;
  }
  .setup-card .stamp{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:3px 8px;
    border-radius:4px;
    margin-bottom:16px;
  }
  .setup-card h1{
    font-size:28px;
    margin:0 0 8px;
    font-weight:600;
  }
  .setup-card p{
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.5;
    margin:0 0 22px;
  }
  .setup-card input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    color:var(--ink);
    margin-bottom:12px;
  }
  .setup-card input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .btn{
    width:100%;
    padding:12px 14px;
    border:none;
    border-radius:8px;
    background:var(--ink);
    color:var(--paper);
    font-size:14px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .btn:hover{background:#33414d;}
  .setup-note{
    margin-top:16px;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  /* ---------- App shell ---------- */
  #app{display:none; min-height:100vh; flex-direction:column;}
  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 28px;
    border-bottom:1px solid var(--line);
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:22px; margin:0; font-weight:600;}
  .brand .tagline{font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .sync-status{
    display:flex; align-items:center; gap:10px;
    font-size:12px; color:var(--ink-soft);
  }
  .sync-code-badge{
    font-family:'IBM Plex Mono', monospace;
    border:1px solid var(--line);
    background:var(--paper-dim);
    padding:4px 9px;
    border-radius:6px;
    letter-spacing:.03em;
  }
  .link-btn{
    background:none; border:none; padding:0; cursor:pointer;
    color:var(--ink-soft); text-decoration:underline; font-size:12px;
  }
  .link-btn:hover{color:var(--ink);}

  .layout{
    display:flex;
    flex:1;
    min-height:0;
  }

  /* ---------- Sidebar / folder tabs ---------- */
  aside.sidebar{
    width:230px;
    flex-shrink:0;
    padding:22px 0 22px 22px;
    border-right:1px solid var(--line);
  }
  .sidebar h2{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--ink-soft);
    margin:0 22px 12px 0;
    font-weight:600;
  }
  .cat-list{list-style:none; margin:0; padding:0;}
  .cat-tab{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:11px 14px;
    margin-bottom:7px;
    margin-right:0;
    border:1px solid var(--line);
    border-right:none;
    border-radius:8px 0 0 8px;
    background:var(--paper-dim);
    cursor:pointer;
    font-size:14px;
    font-weight:500;
  }
  .cat-tab .dot{width:9px;height:9px;border-radius:50%; flex-shrink:0;}
  .cat-tab .name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:'Fraunces',serif; font-weight:500;}
  .cat-tab .del{
    opacity:0; border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:14px; line-height:1; padding:2px;
  }
  .cat-tab:hover .del{opacity:1;}
  .cat-tab.active{
    background:var(--paper);
    border-color:var(--line);
    box-shadow:var(--shadow);
    transform:translateX(0);
  }
  .cat-tab.active::after{
    content:"";
    position:absolute;
    right:-1px; top:0; bottom:0;
    width:1px;
    background:var(--paper);
  }
  .add-cat{
    margin-top:10px;
    display:flex;
    gap:6px;
    padding-right:22px;
  }
  .add-cat input{
    flex:1; min-width:0;
    padding:9px 10px;
    border:1px dashed var(--line);
    border-radius:6px;
    background:transparent;
    font-size:13px;
    color:var(--ink);
  }
  .add-cat button{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    padding:0 12px;
    cursor:pointer;
    font-size:16px;
    color:var(--ink-soft);
  }
  .add-cat button:hover{color:var(--ink);}

  /* ---------- Main content ---------- */
  main.content{
    flex:1;
    padding:26px 34px 60px;
    overflow-y:auto;
  }
  .content-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
  }
  .content-header .dot{width:12px;height:12px;border-radius:50%;}
  .content-header h2{font-size:26px; margin:0; font-weight:600;}

  .empty-state{
    color:var(--ink-soft);
    font-size:14px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:26px;
    text-align:center;
    max-width:480px;
  }

  .add-objective{
    display:flex; gap:8px; margin-bottom:20px; max-width:480px;
  }
  .add-objective input{
    flex:1;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    font-size:14px;
  }
  .add-objective button{
    padding:0 16px;
    border:none;
    border-radius:8px;
    background:var(--ink);
    color:var(--paper);
    font-weight:600;
    cursor:pointer;
    font-size:13px;
  }
  .add-objective button:hover{background:#33414d;}

  .filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0 0 18px;
    max-width:640px;
  }
  .filter-pill{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    border-radius:999px;
    padding:7px 12px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition:all .15s ease;
  }
  .filter-pill.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .filter-pill .dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    margin-right:6px;
    vertical-align:middle;
  }
  .filter-pill[data-filter="urgent"] .dot{ background:var(--danger); }
  .urgent-list{
    display:grid;
    gap:10px;
    max-width:640px;
    margin-top:18px;
  }
  .urgent-item{
    background:rgba(255,255,255,0.45);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
  }
  .urgent-item__meta{
    color:var(--ink-soft);
    font-size:12px;
    margin-bottom:8px;
  }
  .urgent-item__row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .urgent-item__row input[type=checkbox]{
    width:16px;
    height:16px;
    accent-color:var(--teal);
    flex-shrink:0;
    cursor:pointer;
  }
  .urgent-item__row .task-text{
    flex:1;
    min-width:0;
    font-size:14px;
    word-break:break-word;
  }
  .urgent-item__row .task-del{
    border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:13px; opacity:1; flex-shrink:0;
  }

  /* ---------- Objective card ---------- */
  .objective{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin-bottom:16px;
    max-width:640px;
    overflow:hidden;
  }
  .objective-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    cursor:pointer;
  }
  .objective-head .chevron{
    color:var(--ink-soft);
    font-size:12px;
    transition:transform .15s ease;
    flex-shrink:0;
  }
  .objective.open .chevron{transform:rotate(90deg);}
  .objective-title{
    flex:1;
    min-width:0;
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:500;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .objective-title.done{color:var(--ink-soft); text-decoration:line-through;}
  .obj-frac{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .obj-del{
    border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:14px; opacity:0; flex-shrink:0;
  }
  .objective-head:hover .obj-del{opacity:1;}

  /* ruler progress */
  .ruler{
    display:flex;
    gap:2px;
    padding:0 18px 14px;
  }
  .ruler .tick{
    flex:1;
    height:8px;
    border-radius:2px;
    background:var(--paper-dim);
    border:1px solid var(--line);
  }
  .ruler .tick.filled{
    border-color:transparent;
  }
  .ruler.empty{
    padding:0 18px 14px;
    font-size:12px;
    color:var(--ink-soft);
    font-style:italic;
  }

  .tasks{
    display:none;
    padding:0 18px 18px;
    border-top:1px solid var(--line);
  }
  .objective.open .tasks{display:block; padding-top:12px;}
  .task-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    border-radius:10px;
    border:1px solid transparent;
    transition:background-color .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .task-row.task-row--urgent{
    background:rgba(181, 83, 60, 0.06);
    border-color:rgba(181, 83, 60, 0.2);
  }
  .task-row.task-row--focus{
    background:rgba(200, 150, 30, 0.08);
    border:1px solid rgba(200, 150, 30, 0.45);
    padding-left:8px;
    padding-right:8px;
    box-shadow:0 0 0 1px rgba(200, 150, 30, 0.12);
  }
  .task-row input[type=checkbox]{
    width:17px; height:17px;
    accent-color:var(--teal);
    flex-shrink:0;
    cursor:pointer;
  }
  .task-text{
    flex:1;
    font-size:14px;
    min-width:0;
    word-break:break-word;
  }
  .task-text.done{color:var(--ink-soft); text-decoration:line-through;}
  .task-meta{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .urgent-badge,
  .urgent-toggle{
    border:none;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .urgent-badge{
    background:rgba(181, 83, 60, 0.12);
    color:var(--danger);
    padding:5px 8px;
  }
  .urgent-toggle{
    background:transparent;
    color:var(--ink-soft);
    padding:5px 7px;
    border:1px solid var(--line);
  }
  .urgent-toggle.urgent-active{
    background:var(--danger);
    color:#fff;
    border-color:var(--danger);
  }
  .task-del{
    border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:13px; opacity:0; flex-shrink:0;
  }
  .task-row:hover .task-del{opacity:1;}
  .add-task{
    display:flex; gap:8px; margin-top:8px;
  }
  .add-task input{
    flex:1;
    padding:8px 10px;
    border:1px dashed var(--line);
    border-radius:6px;
    background:transparent;
    font-size:13px;
  }
  .add-task button{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    padding:0 12px;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:15px;
  }
  .add-task button:hover{color:var(--ink);}

  /* ---------- Toggle de vista ---------- */
  .view-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    flex-shrink:0;
  }
  .view-toggle button{
    border:none;
    background:var(--paper);
    color:var(--ink-soft);
    font-size:12px;
    font-weight:600;
    letter-spacing:.01em;
    padding:7px 13px;
    cursor:pointer;
  }
  .view-toggle button + button{ border-left:1px solid var(--line); }
  .view-toggle button.active{ background:var(--ink); color:var(--paper); }

  .inbox-panel,
  .board-panel{
    background:rgba(255,255,255,0.28);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:20px;
    max-width:980px;
  }
  .inbox-header,
  .board-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .inbox-header h3,
  .board-header h3{
    margin:0;
    font-size:18px;
    font-weight:600;
  }
  .inbox-form{
    display:grid;
    grid-template-columns:1.7fr 1fr 1fr auto;
    gap:10px;
    margin-bottom:16px;
  }
  .inbox-form textarea,
  .inbox-form select,
  .inbox-form button,
  .board-card select,
  .board-card button{
    font:inherit;
  }
  .inbox-form textarea,
  .inbox-form select{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    padding:10px 12px;
    color:var(--ink);
  }
  .inbox-form textarea{
    min-height:70px;
    resize:vertical;
  }
  .inbox-form button,
  .board-card button{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    font-weight:600;
  }
  .inbox-items{
    display:grid;
    gap:10px;
  }
  .inbox-item{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:center;
    background:rgba(255,255,255,0.45);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
  }
  .inbox-item p{
    margin:0;
    color:var(--ink);
    line-height:1.5;
    flex:1;
  }
  .inbox-item small{
    display:block;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .inbox-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .inbox-actions select{
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    padding:8px 10px;
  }
  .inbox-item button{
    border:none;
    border-radius:8px;
    background:var(--gold);
    color:#fff;
    padding:8px 10px;
    cursor:pointer;
    font-weight:600;
  }

  .board-columns{
    display:grid;
    grid-template-columns:repeat(4, minmax(220px, 1fr));
    gap:16px;
  }
  .board-column{
    background:rgba(255,255,255,0.26);
    border:1px solid var(--line);
    border-radius:16px;
    min-height:300px;
    padding:12px;
  }
  .board-column-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    padding:0 4px;
  }
  .board-column-header h4{
    margin:0;
    font-size:14px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .board-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:999px;
    min-width:24px;
    height:24px;
    color:#fff;
    background:var(--ink);
    font-size:11px;
    font-weight:700;
  }
  .board-list{
    display:grid;
    gap:10px;
  }
  .board-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 6px 12px -10px rgba(31,42,51,0.3);
    padding:12px;
    display:grid;
    gap:8px;
  }
  .board-card.urgent{
    border-color:rgba(181,83,60,0.5);
    background:rgba(181,83,60,0.04);
  }
  .board-card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .board-card-tag{
    display:inline-flex;
    align-items:center;
    border-radius:999px;
    padding:4px 8px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:rgba(47,111,107,0.1);
    color:var(--teal);
  }
  .board-card-tag.urgent{
    background:rgba(181,83,60,0.12);
    color:var(--danger);
  }
  .board-card-title{
    margin:0;
    font-size:14px;
    line-height:1.4;
    font-weight:600;
  }
  .board-card-meta{
    margin:0;
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .board-card-actions{
    display:grid;
    gap:8px;
    margin-top:6px;
  }
  .board-card-actions label{
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .board-card select{
    appearance:none;
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    padding:8px 10px;
  }

  /* ---------- Organigrama ---------- */
  #chart-view{
    display:none;
    flex:1;
    overflow:auto;
    padding:30px 24px 40px;
    background:linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0));
  }
  .chart-shell{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .chart-root{
    align-self:flex-start;
    padding:10px 14px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--ink);
    color:var(--paper);
    box-shadow:var(--shadow);
    font-weight:700;
    letter-spacing:.02em;
  }
  .chart-columns{
    display:flex;
    gap:18px;
    align-items:flex-start;
    justify-content:flex-start;
    flex-wrap:wrap;
  }
  .chart-column{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:min(260px, 32vw);
    min-width:200px;
    flex:0 0 auto;
  }
  .chart-category{
    --cat-accent: var(--gold);
    border:1px solid rgba(30,41,51,0.12);
    border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7));
    box-shadow:0 12px 22px -18px rgba(15,23,42,0.35);
    overflow:hidden;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .chart-category:hover{
    transform:translateY(-1px);
    box-shadow:0 14px 26px -18px rgba(15,23,42,0.45);
  }
  .chart-category-head{
    display:flex;
    align-items:center;

          task.done = Boolean(task.done);
          task.status = task.status || (task.done ? 'done' : 'backlog');
        });
      });
    });
    state.notes = Array.isArray(state.notes) ? state.notes : [];

    currentView = 'list';
    activeCategoryId = catId;
    focusTaskId = taskId;

    const cat = state.categories.find(c => c.id === catId);
    const obj = cat && cat.objectives.find(o => o.id === objId);
    if (obj) obj.open = true;

    render();

    const target = document.querySelector(`[data-task-id="${taskId}"]`);
    if (target) {
      target.classList.add('task-row--focus');
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => target.classList.remove('task-row--focus'), 2200);
    }
  }

  function editTaskInline(catId, objId, taskId, triggerElement){
    const cat = state.categories.find(c => c.id === catId);
    const obj = cat && cat.objectives.find(o => o.id === objId);
    const task = obj && obj.tasks.find(t => t.id === taskId);
    if (!task || !triggerElement) return;

    const editor = document.createElement('div');
    editor.className = 'chart-task-editor';

    const input = document.createElement('input');
    input.type = 'text';
    input.value = task.text;
    input.className = 'chart-task-input';
    input.setAttribute('aria-label', 'Editar tarea');

    const actions = document.createElement('div');
    actions.className = 'chart-task-actions';

    const deleteBtn = document.createElement('button');
    deleteBtn.type = 'button';
    deleteBtn.title = 'Eliminar tarea';
    deleteBtn.textContent = 'X';

    function saveEditedTask(){
      const nextText = input.value.trim();
      if (!nextText) {
        input.focus();
        return;
      }
      task.text = nextText;
      scheduleSave();
      render();
    }

    function deleteCurrentTask(){
      obj.tasks = obj.tasks.filter(t => t.id !== taskId);
      scheduleSave();
      render();
    }

    deleteBtn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      deleteCurrentTask();
    });
    deleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
    });
    input.addEventListener('blur', () => {
      saveEditedTask();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveEditedTask();
      }
      if (e.key === 'Escape') {
        input.value = task.text;
        render();
      }
    });

    actions.appendChild(deleteBtn);
    editor.appendChild(input);
    editor.appendChild(actions);

    const parent = triggerElement.parentElement;
    if (parent) {
      parent.replaceChild(editor, triggerElement);
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }

  // ---------- Render ----------
  function render(){
    document.getElementById('view-list-btn').classList.toggle('active', currentView === 'list');
    document.getElementById('view-chart-btn').classList.toggle('active', currentView === 'chart');
    document.querySelector('aside.sidebar').style.display = currentView === 'list' ? '' : 'none';
    document.getElementById('content').style.display = currentView === 'list' ? '' : 'none';
    document.getElementById('chart-view').style.display = currentView === 'chart' ? 'block' : 'none';

    if (currentView === 'list'){
      renderSidebar();
      renderContent();
    } else {
      renderChart();
      updateFooter();
    }
  }

  document.getElementById('view-list-btn').addEventListener('click', () => {
    currentView = 'list';
    render();
  });
  document.getElementById('view-chart-btn').addEventListener('click', () => {
    currentView = 'chart';
    render();
  });

  function renderSidebar(){
    const list = document.getElementById('cat-list');
    list.innerHTML = '';
    state.categories.forEach((cat, i) => {
      const accent = accentFor(i);
      const li = document.createElement('li');
      li.className = 'cat-tab' + (cat.id === activeCategoryId ? ' active' : '');
      li.innerHTML = `
        <span class="dot" style="background:var(--${accent})"></span>
        <span class="name">${escapeHtml(cat.name)}</span>
        <button class="del" title="Eliminar categoría" data-action="del-cat" data-cat="${cat.id}">✕</button>
      `;
      li.addEventListener('click', (e) => {
        if (e.target.closest('[data-action="del-cat"]')) return;
        activeCategoryId = cat.id;
        render();
      });
      list.appendChild(li);
    });
    list.querySelectorAll('[data-action="del-cat"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteCategory(btn.dataset.cat);
      });
    });
  }

  document.getElementById('new-cat-btn').addEventListener('click', submitNewCategory);
  document.getElementById('new-cat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitNewCategory();
  });
  function submitNewCategory(){
    const input = document.getElementById('new-cat-input');
    const name = input.value.trim();
    if (!name) return;
    addCategory(name);
    input.value = '';
  }

  function renderContent(){
    const content = document.getElementById('content');
    content.innerHTML = '';

    if (!state.categories.length){
      content.innerHTML = `<div class="empty-state">Aún no tienes categorías. Crea la primera desde el panel de la izquierda — por ejemplo "Trabajo", "Salud" o "Finanzas".</div>`;
      updateFooter();
      return;
    }

    const catIndex = state.categories.findIndex(c => c.id === activeCategoryId);
    const cat = catIndex >= 0 ? state.categories[catIndex] : state.categories[0];
    if (!cat){ updateFooter(); return; }
    activeCategoryId = cat.id;
    const accent = accentFor(Math.max(catIndex,0));

    const header = document.createElement('div');
    header.className = 'content-header';
    const headerTitle = urgentFilter === 'urgent' ? 'Urgentes' : cat.name;
    header.innerHTML = `<span class="dot" style="background:var(--${urgentFilter === 'urgent' ? 'danger' : accent})"></span><h2 class="display">${escapeHtml(headerTitle)}</h2>`;
    content.appendChild(header);

    content.appendChild(renderInboxPanel());

    const filterRow = document.createElement('div');
    filterRow.className = 'filter-row';
    filterRow.innerHTML = `
      <button class="filter-pill ${urgentFilter === 'all' ? 'active' : ''}" data-filter="all"><span class="dot"></span>Todas</button>
      <button class="filter-pill ${urgentFilter === 'urgent' ? 'active' : ''}" data-filter="urgent"><span class="dot"></span>Urgentes</button>
    `;
    content.appendChild(filterRow);
    filterRow.querySelectorAll('.filter-pill').forEach(button => {
      button.addEventListener('click', () => {
        urgentFilter = button.dataset.filter;
        render();
      });
    });

    if (urgentFilter === 'urgent') {
      const urgentTasks = [];
      state.categories.forEach(category => {
        category.objectives.forEach(objective => {
          objective.tasks.forEach(task => {
            if (task.urgent && !task.done) {
              urgentTasks.push({ category, objective, task });
            }
          });
        });
      });

      const urgentList = document.createElement('div');
      urgentList.className = 'urgent-list';

      if (!urgentTasks.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No hay tareas urgentes pendientes.';
        urgentList.appendChild(empty);
      } else {
        urgentTasks.forEach(({ category, objective, task }) => {
          const item = document.createElement('div');
          item.className = 'urgent-item';

          const meta = document.createElement('div');
          meta.className = 'urgent-item__meta';
          meta.textContent = `${category.name} · ${objective.title}`;

          const row = document.createElement('div');
          row.className = 'urgent-item__row';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = Boolean(task.done);
          checkbox.dataset.action = 'toggle-task';
          checkbox.dataset.cat = category.id;
          checkbox.dataset.obj = objective.id;
          checkbox.dataset.task = task.id;
          checkbox.addEventListener('change', () => toggleTask(category.id, objective.id, task.id));

          const taskText = document.createElement('span');
          taskText.className = 'task-text';
          taskText.textContent = task.text;
          taskText.style.cursor = 'pointer';
          taskText.title = 'Editar tarea';
          taskText.addEventListener('click', () => editTaskInline(category.id, objective.id, task.id, taskText));

          const deleteBtn = document.createElement('button');
          deleteBtn.type = 'button';
          deleteBtn.className = 'task-del';
          deleteBtn.title = 'Eliminar tarea';
          deleteBtn.textContent = '✕';
          deleteBtn.addEventListener('click', () => deleteTask(category.id, objective.id, task.id));

          row.appendChild(checkbox);
          row.appendChild(taskText);
          row.appendChild(deleteBtn);
          item.appendChild(meta);
          item.appendChild(row);
          urgentList.appendChild(item);
        });
      }

      content.appendChild(urgentList);
      updateFooter();
      return;
    }

    const addObj = document.createElement('div');
    addObj.className = 'add-objective';
    addObj.innerHTML = `
      <input type="text" placeholder="Nuevo objetivo en esta categoría" id="new-obj-input">
      <button id="new-obj-btn">Agregar</button>
    `;
    content.appendChild(addObj);
    addObj.querySelector('#new-obj-btn').addEventListener('click', () => submitNewObjective(cat.id));
    addObj.querySelector('#new-obj-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitNewObjective(cat.id);
    });

    if (!cat.objectives.length){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Sin objetivos todavía. Agrega uno arriba para empezar a sumar tareas.';
      content.appendChild(empty);
    }

    cat.objectives.forEach(obj => {
      const visibleTasks = obj.tasks.filter(task => {
        if (urgentFilter === 'pending') return !task.done;
        return true;
      });
      if (urgentFilter !== 'all' && visibleTasks.length === 0 && obj.tasks.length === 0) {
        return;
      }
      const filteredObj = { ...obj, tasks: visibleTasks };
      content.appendChild(renderObjective(cat.id, filteredObj, { isFiltered: urgentFilter !== 'all' }));
    });

    updateFooter();
  }

  function submitNewObjective(catId){
    const input = document.getElementById('new-obj-input');
    const title = input.value.trim();
    if (!title) return;
    addObjective(catId, title);
  }

  function renderInboxPanel(){
    const panel = document.createElement('section');
    panel.className = 'inbox-panel';

    const header = document.createElement('div');
    header.className = 'inbox-header';
    header.innerHTML = '<h3>Notas emergentes</h3>';
    panel.appendChild(header);

    const form = document.createElement('div');
    form.className = 'inbox-form';
    form.innerHTML = `
      <textarea id="inbox-note-text" placeholder="Escribe algo breve que te haya surgido..."></textarea>
      <select id="inbox-category-select">
        <option value="">Categoría</option>
        ${state.categories.map(cat => `<option value="${cat.id}">${escapeHtml(cat.name)}</option>`).join('')}
      </select>
      <select id="inbox-objective-select">
        <option value="">Objetivo</option>
      </select>
      <button id="inbox-add-btn">Lanzar</button>
    `;
    panel.appendChild(form);

    const categorySelect = form.querySelector('#inbox-category-select');
    const objectiveSelect = form.querySelector('#inbox-objective-select');
    categorySelect.addEventListener('change', () => {
      const catId = categorySelect.value;
      const cat = state.categories.find(c => c.id === catId);
      objectiveSelect.innerHTML = '<option value="">Objetivo</option>' + (cat ? cat.objectives.map(obj => `<option value="${obj.id}">${escapeHtml(obj.title)}</option>`).join('') : '');
    });

    form.querySelector('#inbox-add-btn').addEventListener('click', () => {
      const text = form.querySelector('#inbox-note-text').value.trim();
      const catId = categorySelect.value;
      const objId = objectiveSelect.value;
      if (!text) return;
      state.notes.push({ id: uid(), text, categoryId: catId || '', objectiveId: objId || '', createdAt: new Date().toISOString() });
      form.querySelector('#inbox-note-text').value = '';
      categorySelect.value = '';
      objectiveSelect.innerHTML = '<option value="">Objetivo</option>';
      scheduleSave();
      render();
    });

    const list = document.createElement('div');
    list.className = 'inbox-items';
    if (!state.notes.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No hay anotaciones emergentes. Guarda ideas rápidas aquí y luego las mandas a una categoría.';
      list.appendChild(empty);
    } else {
      state.notes.forEach(note => {
        const item = document.createElement('div');
        item.className = 'inbox-item';
        const cat = state.categories.find(c => c.id === note.categoryId);
        const obj = cat && cat.objectives.find(o => o.id === note.objectiveId);
        item.innerHTML = `
          <div>
            <p>${escapeHtml(note.text)}</p>
            <small>${obj ? `${escapeHtml(cat.name)} · ${escapeHtml(obj.title)}` : 'Sin destino aún'}</small>
          </div>
          <div class="inbox-actions">
            <select data-note-id="${note.id}" data-role="note-target">
              <option value="">Destino</option>
              ${state.categories.map(catOption => `<optgroup label="${escapeHtml(catOption.name)}">${catOption.objectives.map(objOption => `<option value="${catOption.id}|${objOption.id}" ${note.categoryId === catOption.id && note.objectiveId === objOption.id ? 'selected' : ''}>${escapeHtml(objOption.title)}</option>`).join('')}</optgroup>`).join('')}
            </select>
            <button data-note-id="${note.id}" data-role="note-send">Enviar</button>
          </div>
        `;
        list.appendChild(item);
      });
    }
    panel.appendChild(list);

    list.querySelectorAll('[data-role="note-send"]').forEach(button => {
      button.addEventListener('click', () => {
        const noteId = button.dataset.noteId;
        const note = state.notes.find(n => n.id === noteId);
        if (!note) return;
        const select = list.querySelector(`[data-note-id="${noteId}"][data-role="note-target"]`);
        if (!select || !select.value) return;
        const [catId, objId] = select.value.split('|');
        const cat = state.categories.find(c => c.id === catId);
        const obj = cat && cat.objectives.find(o => o.id === objId);
        if (!obj) return;
        obj.tasks.push({ id: uid(), text: note.text, done: false, urgent: false, status: 'backlog' });
        state.notes = state.notes.filter(n => n.id !== noteId);
        activeCategoryId = catId;
        scheduleSave();
        render();
      });
    });

    return panel;
  }

  function renderObjective(catId, obj, options = {}){
    const wrap = document.createElement('div');
    wrap.className = 'objective' + (obj.open ? ' open' : '');

    const total = obj.tasks.length;
    const done = obj.tasks.filter(t => t.done).length;
    const allDone = total > 0 && done === total;

    const head = document.createElement('div');
    head.className = 'objective-head';
    head.innerHTML = `
      <span class="chevron">▶</span>
      <span class="objective-title${allDone ? ' done' : ''}">${escapeHtml(obj.title)}</span>
      <span class="obj-frac">${done}/${total}</span>
      <button class="obj-del" title="Eliminar objetivo" data-action="del-obj">✕</button>
    `;
    head.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="del-obj"]')) return;
      toggleObjectiveOpen(catId, obj.id);
    });
    head.querySelector('[data-action="del-obj"]').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteObjective(catId, obj.id);
    });
    wrap.appendChild(head);

    if (total > 0){
      const ruler = document.createElement('div');
      ruler.className = 'ruler';
      for (let i=0;i<total;i++){
        const tick = document.createElement('div');
        tick.className = 'tick' + (i < done ? ' filled' : '');
        if (i < done) tick.style.background = 'var(--teal)';
        ruler.appendChild(tick);
      }
      wrap.appendChild(ruler);
    } else {
      const ruler = document.createElement('div');
      ruler.className = 'ruler empty';
      ruler.textContent = 'Sin tareas aún';
      wrap.appendChild(ruler);
    }

    const tasksWrap = document.createElement('div');
    tasksWrap.className = 'tasks';
    obj.tasks.forEach(task => {
      const row = document.createElement('div');
      row.className = 'task-row' + (task.urgent && !task.done ? ' task-row--urgent' : '');
      row.dataset.taskId = task.id;
      if (focusTaskId && focusTaskId === task.id) {
        row.classList.add('task-row--focus');
      }
      const urgentMarkup = task.urgent && !task.done ? '<span class="urgent-badge">Urgente</span>' : '';
      row.innerHTML = `
        <input type="checkbox" ${task.done ? 'checked' : ''} data-action="toggle-task" data-task="${task.id}">
        <span class="task-text${task.done ? ' done' : ''}">${escapeHtml(task.text)}</span>
        <div class="task-meta">
          ${urgentMarkup}
          <button class="urgent-toggle ${task.urgent ? 'urgent-active' : ''}" data-action="toggle-urgent" data-task="${task.id}" title="Marcar como urgente">Urg.</button>
        </div>
        <button class="task-del" title="Eliminar tarea" data-action="del-task" data-task="${task.id}">✕</button>
      `;
      row.querySelector('[data-action="toggle-task"]').addEventListener('change', () => toggleTask(catId, obj.id, task.id));
      row.querySelector('[data-action="toggle-urgent"]').addEventListener('click', () => toggleTaskUrgent(catId, obj.id, task.id));
      row.querySelector('[data-action="del-task"]').addEventListener('click', () => deleteTask(catId, obj.id, task.id));
      tasksWrap.appendChild(row);
    });

    if (focusTaskId) {
      const focusedRow = document.querySelector(`[data-task-id="${focusTaskId}"]`);
      if (focusedRow) {
        focusedRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => focusedRow.classList.remove('task-row--focus'), 2200);
      }
      focusTaskId = null;
    }

    const addTaskRow = document.createElement('div');
    addTaskRow.className = 'add-task';
    addTaskRow.innerHTML = `
      <input type="text" placeholder="Nueva tarea">
      <button title="Agregar tarea">+</button>
    `;
    const taskInput = addTaskRow.querySelector('input');
    const taskBtn = addTaskRow.querySelector('button');
    function submitTask(){
      const text = taskInput.value.trim();
      if (!text) return;
      addTask(catId, obj.id, text);
    }
    taskBtn.addEventListener('click', submitTask);
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitTask(); });
    tasksWrap.appendChild(addTaskRow);

    wrap.appendChild(tasksWrap);
    return wrap;
  }

  // ---------- Organigrama ----------
  function renderChart(){
    const container = document.getElementById('chart-view');
    container.innerHTML = '';

    if (!state.categories.length){
      container.innerHTML = `<div class="chart-empty">Aún no tienes categorías. Crea una desde la vista de Lista para verla aquí como organigrama.</div>`;
      return;
    }

    const shell = document.createElement('div');
    shell.className = 'chart-shell';

    const root = document.createElement('div');
    root.className = 'chart-root';
    root.textContent = 'Organizador';
    shell.appendChild(root);

    const columns = document.createElement('div');
    columns.className = 'chart-columns';

    state.categories.forEach((cat, catIndex) => {
      const catOpen = Boolean(cat.chartOpen);
      const catCard = document.createElement('div');
      catCard.className = 'chart-column';

      const accent = accentFor(catIndex);
      const catBtn = document.createElement('button');
      catBtn.type = 'button';
      catBtn.className = 'chart-category-head';
      catBtn.style.setProperty('--cat-accent', `var(--${accent})`);
      const taskTotal = cat.objectives.reduce((sum, obj) => sum + obj.tasks.length, 0);
      catBtn.innerHTML = `
        <span>${escapeHtml(cat.name)}</span>
        <span class="meta">${taskTotal}</span>
      `;
      catBtn.addEventListener('click', () => {
        cat.chartOpen = !cat.chartOpen;
        render();
      });

      const categoryWrap = document.createElement('div');
      categoryWrap.className = 'chart-category';
      categoryWrap.style.setProperty('--cat-accent', `var(--${accent})`);
      categoryWrap.appendChild(catBtn);

      if (catOpen) {
        const objectives = document.createElement('div');
        objectives.className = 'chart-objectives';

        cat.objectives.forEach(obj => {
          const objOpen = Boolean(obj.chartOpen);
          const objective = document.createElement('div');
          objective.className = 'chart-objective';

          const objBtn = document.createElement('button');
          objBtn.type = 'button';
          objBtn.className = 'chart-objective-head';
          const done = obj.tasks.filter(t => t.done).length;
          objBtn.innerHTML = `
            <span class="label">${escapeHtml(obj.title)}</span>
            <span class="count">${done}/${obj.tasks.length}</span>
          `;
          objBtn.addEventListener('click', () => {
            obj.chartOpen = !obj.chartOpen;
            render();
          });
          objective.appendChild(objBtn);

          if (objOpen) {
            const tasks = document.createElement('div');
            tasks.className = 'chart-tasks';
            obj.tasks.forEach(task => {
              const taskBtn = document.createElement('button');
              taskBtn.type = 'button';
              taskBtn.className = 'chart-task' + (task.urgent && !task.done ? ' urgent' : '') + (task.done ? ' done' : '');
              taskBtn.textContent = task.text;
              taskBtn.addEventListener('click', () => editTaskInline(cat.id, obj.id, task.id, taskBtn));
              tasks.appendChild(taskBtn);
            });
            objective.appendChild(tasks);
          }

          objectives.appendChild(objective);
        });

        categoryWrap.appendChild(objectives);
      }

      catCard.appendChild(categoryWrap);
      columns.appendChild(catCard);
    });

    shell.appendChild(columns);
    container.appendChild(shell);
  }

  function updateFooter(){
    const totalObjectives = state.categories.reduce((n,c) => n + c.objectives.length, 0);
    const totalTasks = state.categories.reduce((n,c) => n + c.objectives.reduce((m,o) => m + o.tasks.length, 0), 0);
    const doneTasks = state.categories.reduce((n,c) => n + c.objectives.reduce((m,o) => m + o.tasks.filter(t=>t.done).length, 0), 0);
    document.getElementById('footer-right').textContent =
      `${state.categories.length} categorías · ${totalObjectives} objetivos · ${doneTasks}/${totalTasks} tareas`;
  }

  // ---------- Arranque ----------
  (function init(){
    const codeFromUrl = getCodeFromUrl();
    if (codeFromUrl){
      document.getElementById('code-input').value = codeFromUrl;
      startWithCode(codeFromUrl);
    } else {
      showSetup();
    }
  })();

})();
</script>
</body>

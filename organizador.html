<style>
  :root{
    --paper:#EEEBE2;
    --paper-dim:#E2DECF;
    --ink:#1F2A33;
    --ink-soft:#5B6672;
    --line:#C9C2AE;
    --gold:#C8961E;
    --teal:#2F6F6B;
    --rust:#B5533C;
    --plum:#6B4E71;
    --slate:#3E5C76;
    --olive:#6E7F3F;
    --danger:#B5533C;
    --radius:10px;
    --shadow:0 1px 0 rgba(31,42,51,0.06), 0 8px 20px -12px rgba(31,42,51,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, transparent 0 39px, rgba(31,42,51,0.035) 39px 40px),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Fraunces', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Setup gate ---------- */
  #setup{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .setup-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 32px;
    max-width:380px;
    width:100%;
    text-align:left;
  }
  .setup-card .stamp{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:3px 8px;
    border-radius:4px;
    margin-bottom:16px;
  }
  .setup-card h1{
    font-size:28px;
    margin:0 0 8px;
    font-weight:600;
  }
  .setup-card p{
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.5;
    margin:0 0 22px;
  }
  .setup-card input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    color:var(--ink);
    margin-bottom:12px;
  }
  .setup-card input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .btn{
    width:100%;
    padding:12px 14px;
    border:none;
    border-radius:8px;
    background:var(--ink);
    color:var(--paper);
    font-size:14px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .btn:hover{background:#33414d;}
  .setup-note{
    margin-top:16px;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  /* ---------- App shell ---------- */
  #app{display:none; min-height:100vh; flex-direction:column;}
  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 28px;
    border-bottom:1px solid var(--line);
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:22px; margin:0; font-weight:600;}
  .brand .tagline{font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .sync-status{
    display:flex; align-items:center; gap:10px;
    font-size:12px; color:var(--ink-soft);
  }
  .sync-code-badge{
    font-family:'IBM Plex Mono', monospace;
    border:1px solid var(--line);
    background:var(--paper-dim);
    padding:4px 9px;
    border-radius:6px;
    letter-spacing:.03em;
  }
  .link-btn{
    background:none; border:none; padding:0; cursor:pointer;
    color:var(--ink-soft); text-decoration:underline; font-size:12px;
  }
  .link-btn:hover{color:var(--ink);}

  .layout{
    display:flex;
    flex:1;
    min-height:0;
  }

  /* ---------- Sidebar / folder tabs ---------- */
  aside.sidebar{
    width:230px;
    flex-shrink:0;
    padding:22px 0 22px 22px;
    border-right:1px solid var(--line);
  }
  .sidebar h2{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--ink-soft);
    margin:0 22px 12px 0;
    font-weight:600;
  }
  .cat-list{list-style:none; margin:0; padding:0;}
  .cat-tab{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:11px 14px;
    margin-bottom:7px;
    margin-right:0;
    border:1px solid var(--line);
    border-right:none;
    border-radius:8px 0 0 8px;
    background:var(--paper-dim);
    cursor:pointer;
    font-size:14px;
    font-weight:500;
  }
  .cat-tab .dot{width:9px;height:9px;border-radius:50%; flex-shrink:0;}
  .cat-tab .name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:'Fraunces',serif; font-weight:500;}
  .cat-tab .del{
    opacity:0; border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:14px; line-height:1; padding:2px;
  }
  .cat-tab:hover .del{opacity:1;}
  .cat-tab.active{
    background:var(--paper);
    border-color:var(--line);
    box-shadow:var(--shadow);
    transform:translateX(0);
  }
  .cat-tab.active::after{
    content:"";
    position:absolute;
    right:-1px; top:0; bottom:0;
    width:1px;
    background:var(--paper);
  }
  .add-cat{
    margin-top:10px;
    display:flex;
    gap:6px;
    padding-right:22px;
  }
  .add-cat input{
    flex:1; min-width:0;
    padding:9px 10px;
    border:1px dashed var(--line);
    border-radius:6px;
    background:transparent;
    font-size:13px;
    color:var(--ink);
  }
  .add-cat button{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    padding:0 12px;
    cursor:pointer;
    font-size:16px;
    color:var(--ink-soft);
  }
  .add-cat button:hover{color:var(--ink);}

  /* ---------- Main content ---------- */
  main.content{
    flex:1;
    padding:26px 34px 60px;
    overflow-y:auto;
  }
  .content-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
  }
  .content-header .dot{width:12px;height:12px;border-radius:50%;}
  .content-header h2{font-size:26px; margin:0; font-weight:600;}

  .empty-state{
    color:var(--ink-soft);
    font-size:14px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:26px;
    text-align:center;
    max-width:480px;
  }

  .add-objective{
    display:flex; gap:8px; margin-bottom:20px; max-width:480px;
  }
  .add-objective input{
    flex:1;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    font-size:14px;
  }
  .add-objective button{
    padding:0 16px;
    border:none;
    border-radius:8px;
    background:var(--ink);
    color:var(--paper);
    font-weight:600;
    cursor:pointer;
    font-size:13px;
  }
  .add-objective button:hover{background:#33414d;}

  /* ---------- Objective card ---------- */
  .objective{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin-bottom:16px;
    max-width:640px;
    overflow:hidden;
  }
  .objective-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    cursor:pointer;
  }
  .objective-head .chevron{
    color:var(--ink-soft);
    font-size:12px;
    transition:transform .15s ease;
    flex-shrink:0;
  }
  .objective.open .chevron{transform:rotate(90deg);}
  .objective-title{
    flex:1;
    min-width:0;
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:500;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .objective-title.done{color:var(--ink-soft); text-decoration:line-through;}
  .obj-frac{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .obj-del{
    border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:14px; opacity:0; flex-shrink:0;
  }
  .objective-head:hover .obj-del{opacity:1;}

  /* ruler progress */
  .ruler{
    display:flex;
    gap:2px;
    padding:0 18px 14px;
  }
  .ruler .tick{
    flex:1;
    height:8px;
    border-radius:2px;
    background:var(--paper-dim);
    border:1px solid var(--line);
  }
  .ruler .tick.filled{
    border-color:transparent;
  }
  .ruler.empty{
    padding:0 18px 14px;
    font-size:12px;
    color:var(--ink-soft);
    font-style:italic;
  }

  .tasks{
    display:none;
    padding:0 18px 18px;
    border-top:1px solid var(--line);
  }
  .objective.open .tasks{display:block; padding-top:12px;}
  .task-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 0;
    border-radius:8px;
    transition:background-color .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .task-row.task-row--focus{
    background:rgba(200, 150, 30, 0.08);
    border:1px solid rgba(200, 150, 30, 0.45);
    padding-left:8px;
    padding-right:8px;
    box-shadow:0 0 0 1px rgba(200, 150, 30, 0.12);
  }
  .task-row input[type=checkbox]{
    width:17px; height:17px;
    accent-color:var(--teal);
    flex-shrink:0;
    cursor:pointer;
  }
  .task-text{
    flex:1;
    font-size:14px;
    min-width:0;
    word-break:break-word;
  }
  .task-text.done{color:var(--ink-soft); text-decoration:line-through;}
  .task-del{
    border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:13px; opacity:0; flex-shrink:0;
  }
  .task-row:hover .task-del{opacity:1;}
  .add-task{
    display:flex; gap:8px; margin-top:8px;
  }
  .add-task input{
    flex:1;
    padding:8px 10px;
    border:1px dashed var(--line);
    border-radius:6px;
    background:transparent;
    font-size:13px;
  }
  .add-task button{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    padding:0 12px;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:15px;
  }
  .add-task button:hover{color:var(--ink);}

  /* ---------- Toggle de vista ---------- */
  .view-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    flex-shrink:0;
  }
  .view-toggle button{
    border:none;
    background:var(--paper);
    color:var(--ink-soft);
    font-size:12px;
    font-weight:600;
    letter-spacing:.01em;
    padding:7px 13px;
    cursor:pointer;
  }
  .view-toggle button + button{ border-left:1px solid var(--line); }
  .view-toggle button.active{ background:var(--ink); color:var(--paper); }

  /* ---------- Organigrama ---------- */
  #chart-view{
    display:none;
    flex:1;
    overflow:auto;
    padding:30px 24px;
  }
  #chart-view svg text{ font-family:'IBM Plex Sans', sans-serif; }
  #chart-view .chart-empty{
    color:var(--ink-soft);
    font-size:14px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:26px;
    text-align:center;
    max-width:480px;

  footer.statusbar{
    padding:9px 28px;
    border-top:1px solid var(--line);
    font-size:11.5px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    display:flex;
    justify-content:space-between;
  }

  @media (max-width: 760px){
    .layout{flex-direction:column;}
    aside.sidebar{
      width:auto;
      border-right:none;
      border-bottom:1px solid var(--line);
      padding:16px 16px 18px;
    }
    .sidebar h2{margin-right:0;}
    .cat-list{display:flex; flex-wrap:wrap; gap:8px;}
    .cat-tab{
      border-radius:8px;
      border-right:1px solid var(--line);
      margin:0;
    }
    .cat-tab.active::after{display:none;}
    .add-cat{padding-right:0; width:100%; margin-top:12px;}
    main.content{padding:20px 18px 50px;}
  }

  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>

            { id: 'task-qmv-4', text: 'Todos cambian a la derecha', done: false },
            { id: 'task-qmv-5', text: 'Probar la VR', done: false },
            { id: 'task-qmv-6', text: 'Resolver lo del cumpleaños de Romu con Eli', done: false }
          ]
        }
      ]
    },
    {
      id: 'cat-social',
      name: 'Social y comunidad',
      objectives: [
        {
          id: 'obj-social-contacto',
          title: 'Eventos, contacto y organización',
          open: true,
          tasks: [
            { id: 'task-social-1', text: 'Hablar de rayuela en el Lero e invitar a Luis Cotal', done: false },
            { id: 'task-social-2', text: 'Invitar a Lore y Benja a la ludoteca', done: false },
            { id: 'task-social-3', text: 'Socializar horario de ludoteca y grupos por WhatsApp', done: false },
            { id: 'task-social-4', text: 'Armar reunión para la otra semana con Christian Torres', done: false },
            { id: 'task-social-5', text: 'Ir al Greed hoy viernes 22:30', done: false },
            { id: 'task-social-6', text: 'Revisar la lista de Santa', done: false }
          ]
        }
      ]
    }
  ];

  // ---------- Utilidades ----------
  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
  function accentFor(index){ return ACCENTS[index % ACCENTS.length]; }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function nowLabel(){
    const d = new Date();
    return d.toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'});
  }
  function setStatus(text){
    document.getElementById('status-text').textContent = text;
  }

  // ---------- Setup / código de sincronización ----------
  function getCodeFromUrl(){
    const params = new URLSearchParams(window.location.search);
    return params.get('code');
  }
  function setCodeInUrl(code){
    const url = new URL(window.location.href);
    url.searchParams.set('code', code);
    window.history.replaceState(null, '', url.toString());
  }

  function showSetup(){
    document.getElementById('setup').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
  function showApp(){
    document.getElementById('setup').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  }

  document.getElementById('code-submit').addEventListener('click', submitCode);
  document.getElementById('code-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitCode();
  });
  function submitCode(){
    const input = document.getElementById('code-input');
    const code = input.value.trim();
    if (!code){
      document.getElementById('setup-error').textContent = 'Escribe un código antes de continuar.';
      return;
    }
    startWithCode(code);
  }

  document.getElementById('change-code').addEventListener('click', () => {
    const url = new URL(window.location.href);
    url.searchParams.delete('code');
    window.history.replaceState(null, '', url.toString());
    SYNC_CODE = null;
    document.getElementById('code-input').value = '';
    showSetup();
  });

  async function startWithCode(code){
    SYNC_CODE = code;
    setCodeInUrl(code);
    document.getElementById('code-badge').textContent = code;
    showApp();
    await loadData();
    render();
  }

  // ---------- Carga y guardado ----------
  async function loadData(){
    setStatus('Cargando…');
    try{
      const { data, error } = await sb
        .from('organizador_data')
        .select('data')
        .eq('sync_code', SYNC_CODE)
        .maybeSingle();
      if (error) throw error;
      if (data && data.data && Array.isArray(data.data.categories) && data.data.categories.length){
        state.categories = data.data.categories;
      } else {
        state.categories = JSON.parse(JSON.stringify(ORGANIZER_SEED));
      }
      if (state.categories.length && !activeCategoryId){
        activeCategoryId = state.categories[0].id;
      }
      setStatus('Sincronizado ' + nowLabel());
      if (!data || !data.data || !Array.isArray(data.data.categories) || !data.data.categories.length){
        scheduleSave();
      }
    } catch(err){
      console.error(err);
      state.categories = JSON.parse(JSON.stringify(ORGANIZER_SEED));
      if (state.categories.length && !activeCategoryId){
        activeCategoryId = state.categories[0].id;
      }
      setStatus('Sincronizado localmente ' + nowLabel());
      scheduleSave();
    }
  }

  function scheduleSave(){
    setStatus('Guardando…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveData, 500);
  }

  async function saveData(){
    try{
      const { error } = await sb
        .from('organizador_data')
        .upsert({
          sync_code: SYNC_CODE,
          data: { categories: state.categories },
          updated_at: new Date().toISOString()
        }, { onConflict: 'sync_code' });
      if (error) throw error;
      setStatus('Guardado ' + nowLabel());
    } catch(err){
      console.error(err);
      setStatus('Error al guardar — reintenta');
    }
  }

  // ---------- Acciones sobre datos ----------
  function addCategory(name){
    const cat = { id: uid(), name, objectives: [] };
    state.categories.push(cat);
    activeCategoryId = cat.id;
    scheduleSave();
    render();
  }
  function deleteCategory(id){
    if (!confirm('¿Eliminar esta categoría y todo lo que contiene?')) return;
    state.categories = state.categories.filter(c => c.id !== id);
    if (activeCategoryId === id){
      activeCategoryId = state.categories.length ? state.categories[0].id : null;
    }
    scheduleSave();
    render();
  }
  function addObjective(catId, title){
    const cat = state.categories.find(c => c.id === catId);
    if (!cat) return;
    cat.objectives.push({ id: uid(), title, open:false, tasks: [] });
    scheduleSave();
    render();
  }
  function deleteObjective(catId, objId){
    const cat = state.categories.find(c => c.id === catId);
    if (!cat) return;
    cat.objectives = cat.objectives.filter(o => o.id !== objId);
    scheduleSave();
    render();
  }
  function toggleObjectiveOpen(catId, objId){
    const cat = state.categories.find(c => c.id === catId);
    const obj = cat && cat.objectives.find(o => o.id === objId);
    if (!obj) return;
    obj.open = !obj.open;
    render();
  }
  function addTask(catId, objId, text){
    const cat = state.categories.find(c => c.id === catId);
    const obj = cat && cat.objectives.find(o => o.id === objId);
    if (!obj) return;
    obj.tasks.push({ id: uid(), text, done:false });
    scheduleSave();
    render();
  }
  function toggleTask(catId, objId, taskId){
    const cat = state.categories.find(c => c.id === catId);
    const obj = cat && cat.objectives.find(o => o.id === objId);
    const task = obj && obj.tasks.find(t => t.id === taskId);
    if (!task) return;
    task.done = !task.done;
    scheduleSave();
    render();
  }
  function deleteTask(catId, objId, taskId){
    const cat = state.categories.find(c => c.id === catId);
    const obj = cat && cat.objectives.find(o => o.id === objId);
    if (!obj) return;
    obj.tasks = obj.tasks.filter(t => t.id !== taskId);
    scheduleSave();
    render();
  }

  function focusTaskInList(catId, objId, taskId){
    currentView = 'list';
    activeCategoryId = catId;
    focusTaskId = taskId;

    const cat = state.categories.find(c => c.id === catId);
    const obj = cat && cat.objectives.find(o => o.id === objId);
    if (obj) obj.open = true;

    render();

    const target = document.querySelector(`[data-task-id="${taskId}"]`);
    if (target) {
      target.classList.add('task-row--focus');
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => target.classList.remove('task-row--focus'), 2200);
    }
  }

  // ---------- Render ----------
  function render(){
    document.getElementById('view-list-btn').classList.toggle('active', currentView === 'list');
    document.getElementById('view-chart-btn').classList.toggle('active', currentView === 'chart');
    document.querySelector('aside.sidebar').style.display = currentView === 'list' ? '' : 'none';
    document.getElementById('content').style.display = currentView === 'list' ? '' : 'none';
    document.getElementById('chart-view').style.display = currentView === 'list' ? 'none' : 'block';

    if (currentView === 'list'){
      renderSidebar();
      renderContent();
    } else {
      renderChart();
      updateFooter();
    }
  }

  document.getElementById('view-list-btn').addEventListener('click', () => {
    currentView = 'list';
    render();
  });
  document.getElementById('view-chart-btn').addEventListener('click', () => {
    currentView = 'chart';
    render();
  });

  function renderSidebar(){
    const list = document.getElementById('cat-list');
    list.innerHTML = '';
    state.categories.forEach((cat, i) => {
      const accent = accentFor(i);
      const li = document.createElement('li');
      li.className = 'cat-tab' + (cat.id === activeCategoryId ? ' active' : '');
      li.innerHTML = `
        <span class="dot" style="background:var(--${accent})"></span>
        <span class="name">${escapeHtml(cat.name)}</span>
        <button class="del" title="Eliminar categoría" data-action="del-cat" data-cat="${cat.id}">✕</button>
      `;
      li.addEventListener('click', (e) => {
        if (e.target.closest('[data-action="del-cat"]')) return;
        activeCategoryId = cat.id;
        render();
      });
      list.appendChild(li);
    });
    list.querySelectorAll('[data-action="del-cat"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteCategory(btn.dataset.cat);
      });
    });
  }

  document.getElementById('new-cat-btn').addEventListener('click', submitNewCategory);
  document.getElementById('new-cat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitNewCategory();
  });
  function submitNewCategory(){
    const input = document.getElementById('new-cat-input');
    const name = input.value.trim();
    if (!name) return;
    addCategory(name);
    input.value = '';
  }

  function renderContent(){
    const content = document.getElementById('content');
    content.innerHTML = '';

    if (!state.categories.length){
      content.innerHTML = `<div class="empty-state">Aún no tienes categorías. Crea la primera desde el panel de la izquierda — por ejemplo "Trabajo", "Salud" o "Finanzas".</div>`;
      updateFooter();
      return;
    }

    const catIndex = state.categories.findIndex(c => c.id === activeCategoryId);
    const cat = catIndex >= 0 ? state.categories[catIndex] : state.categories[0];
    if (!cat){ updateFooter(); return; }
    activeCategoryId = cat.id;
    const accent = accentFor(Math.max(catIndex,0));

    const header = document.createElement('div');
    header.className = 'content-header';
    header.innerHTML = `<span class="dot" style="background:var(--${accent})"></span><h2 class="display">${escapeHtml(cat.name)}</h2>`;
    content.appendChild(header);

    const addObj = document.createElement('div');
    addObj.className = 'add-objective';
    addObj.innerHTML = `
      <input type="text" placeholder="Nuevo objetivo en esta categoría" id="new-obj-input">
      <button id="new-obj-btn">Agregar</button>
    `;
    content.appendChild(addObj);
    addObj.querySelector('#new-obj-btn').addEventListener('click', () => submitNewObjective(cat.id));
    addObj.querySelector('#new-obj-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitNewObjective(cat.id);
    });

    if (!cat.objectives.length){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Sin objetivos todavía. Agrega uno arriba para empezar a sumar tareas.';
      content.appendChild(empty);
    }

    cat.objectives.forEach(obj => {
      content.appendChild(renderObjective(cat.id, obj));
    });

    updateFooter();
  }

  function submitNewObjective(catId){
    const input = document.getElementById('new-obj-input');
    const title = input.value.trim();
    if (!title) return;
    addObjective(catId, title);
  }

  function renderObjective(catId, obj){
    const wrap = document.createElement('div');
    wrap.className = 'objective' + (obj.open ? ' open' : '');

    const total = obj.tasks.length;
    const done = obj.tasks.filter(t => t.done).length;
    const allDone = total > 0 && done === total;

    const head = document.createElement('div');
    head.className = 'objective-head';
    head.innerHTML = `
      <span class="chevron">▶</span>
      <span class="objective-title${allDone ? ' done' : ''}">${escapeHtml(obj.title)}</span>
      <span class="obj-frac">${done}/${total}</span>
      <button class="obj-del" title="Eliminar objetivo" data-action="del-obj">✕</button>
    `;
    head.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="del-obj"]')) return;
      toggleObjectiveOpen(catId, obj.id);
    });
    head.querySelector('[data-action="del-obj"]').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteObjective(catId, obj.id);
    });
    wrap.appendChild(head);

    if (total > 0){
      const ruler = document.createElement('div');
      ruler.className = 'ruler';
      for (let i=0;i<total;i++){
        const tick = document.createElement('div');
        tick.className = 'tick' + (i < done ? ' filled' : '');
        if (i < done) tick.style.background = 'var(--teal)';
        ruler.appendChild(tick);
      }
      wrap.appendChild(ruler);
    } else {
      const ruler = document.createElement('div');
      ruler.className = 'ruler empty';
      ruler.textContent = 'Sin tareas aún';
      wrap.appendChild(ruler);
    }

    const tasksWrap = document.createElement('div');
    tasksWrap.className = 'tasks';
    obj.tasks.forEach(task => {
      const row = document.createElement('div');
      row.className = 'task-row';
      row.dataset.taskId = task.id;
      if (focusTaskId && focusTaskId === task.id) {
        row.classList.add('task-row--focus');
      }
      row.innerHTML = `
        <input type="checkbox" ${task.done ? 'checked' : ''} data-action="toggle-task" data-task="${task.id}">
        <span class="task-text${task.done ? ' done' : ''}">${escapeHtml(task.text)}</span>
        <button class="task-del" title="Eliminar tarea" data-action="del-task" data-task="${task.id}">✕</button>
      `;
      row.querySelector('[data-action="toggle-task"]').addEventListener('change', () => toggleTask(catId, obj.id, task.id));
      row.querySelector('[data-action="del-task"]').addEventListener('click', () => deleteTask(catId, obj.id, task.id));
      tasksWrap.appendChild(row);
    });

    if (focusTaskId) {
      const focusedRow = document.querySelector(`[data-task-id="${focusTaskId}"]`);
      if (focusedRow) {
        focusedRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => focusedRow.classList.remove('task-row--focus'), 2200);
      }
      focusTaskId = null;
    }

    const addTaskRow = document.createElement('div');
    addTaskRow.className = 'add-task';
    addTaskRow.innerHTML = `
      <input type="text" placeholder="Nueva tarea">
      <button title="Agregar tarea">+</button>
    `;
    const taskInput = addTaskRow.querySelector('input');
    const taskBtn = addTaskRow.querySelector('button');
    function submitTask(){
      const text = taskInput.value.trim();
      if (!text) return;
      addTask(catId, obj.id, text);
    }
    taskBtn.addEventListener('click', submitTask);
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitTask(); });
    tasksWrap.appendChild(addTaskRow);

    wrap.appendChild(tasksWrap);
    return wrap;
  }

  // ---------- Organigrama ----------
  function renderChart(){
    const container = document.getElementById('chart-view');
    container.innerHTML = '';

    if (!state.categories.length){
      container.innerHTML = `<div class="chart-empty">Aún no tienes categorías. Crea una desde la vista de Lista para verla aquí como organigrama.</div>`;
      return;
    }

    const LEVEL_H = 110;
    const H_GAP = 20;
    const NODE_H = 44;
    const MIN_TASK_W = 130;
    const MIN_OBJ_W = 155;
    const MIN_CAT_W = 165;
    const MIN_ROOT_W = 175;

    function layoutTasks(tasks){
      return tasks.map(t => ({ type:'task', data:t, width: MIN_TASK_W, children: [], x:0 }));
    }
    function layoutObjectives(objs){
      return objs.map(o => {
        const children = layoutTasks(o.tasks);
        const childrenWidth = children.length ? children.reduce((s,c)=>s+c.width,0) + H_GAP*(children.length-1) : 0;
        return { type:'objective', data:o, width: Math.max(MIN_OBJ_W, childrenWidth), children, x:0 };
      });
    }
    function layoutCategories(cats){
      return cats.map((c,i) => {
        const children = layoutObjectives(c.objectives);
        const childrenWidth = children.length ? children.reduce((s,c2)=>s+c2.width,0) + H_GAP*(children.length-1) : 0;
        return { type:'category', data:c, index:i, width: Math.max(MIN_CAT_W, childrenWidth), children, x:0 };
      });
    }

    const catNodes = layoutCategories(state.categories);
    const totalWidth = catNodes.reduce((s,c)=>s+c.width,0) + H_GAP*Math.max(catNodes.length-1,0);
    const rootWidth = Math.max(MIN_ROOT_W, totalWidth);

    function assignX(nodes, startX){
      let cursor = startX;
      nodes.forEach(n => {
        n.x = cursor + n.width/2;
        if (n.children.length){
          const childrenWidth = n.children.reduce((s,c)=>s+c.width,0) + H_GAP*(n.children.length-1);
          assignX(n.children, n.x - childrenWidth/2);
        }
        cursor += n.width + H_GAP;
      });
    }
    assignX(catNodes, (rootWidth - totalWidth)/2);

    let maxDepth = 1;
    catNodes.forEach(c => {
      if (c.children.length){
        maxDepth = Math.max(maxDepth, 2);
        c.children.forEach(o => { if (o.children.length) maxDepth = Math.max(maxDepth, 3); });
      }
    });
    const totalHeight = maxDepth*LEVEL_H + NODE_H + 30;
    const rootX = rootWidth/2;

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox', `0 0 ${rootWidth} ${totalHeight}`);
    svg.setAttribute('width', rootWidth);
    svg.setAttribute('height', totalHeight);
    svg.style.display = 'block';

    function addLine(x1,y1,x2,y2){
      const path = document.createElementNS(svgNS,'path');
      const midY = (y1+y2)/2;
      path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`);
      path.setAttribute('stroke', 'var(--line)');
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('fill', 'none');
      svg.appendChild(path);
    }

    function addNode(x, y, width, label, opts){
      opts = opts || {};
      const g = document.createElementNS(svgNS,'g');
      g.setAttribute('transform', `translate(${x - width/2}, ${y})`);
      if (opts.onClick){
        g.style.cursor = 'pointer';
        g.addEventListener('click', opts.onClick);
      }
      const rect = document.createElementNS(svgNS,'rect');
      rect.setAttribute('width', width);
      rect.setAttribute('height', NODE_H);
      rect.setAttribute('rx', 9);
      rect.setAttribute('fill', opts.fill || 'var(--paper)');
      rect.setAttribute('stroke', opts.stroke || 'var(--line)');
      rect.setAttribute('stroke-width', opts.strokeWidth || 1);
      g.appendChild(rect);

      if (opts.dotColor){
        const dot = document.createElementNS(svgNS,'circle');
        dot.setAttribute('cx', 15);
        dot.setAttribute('cy', NODE_H/2);
        dot.setAttribute('r', 4.5);
        dot.setAttribute('fill', opts.dotColor);
        g.appendChild(dot);
      }

      const text = document.createElementNS(svgNS,'text');
      const textX = opts.dotColor ? 27 : width/2;
      text.setAttribute('x', textX);
      text.setAttribute('y', NODE_H/2 + 4.5);
      text.setAttribute('text-anchor', opts.dotColor ? 'start' : 'middle');
      text.setAttribute('font-family', opts.fontFamily || "'IBM Plex Sans', sans-serif");
      text.setAttribute('font-size', opts.fontSize || 12.5);
      text.setAttribute('font-weight', opts.fontWeight || 500);
      text.setAttribute('fill', opts.textColor || 'var(--ink)');
      if (opts.strike) text.setAttribute('text-decoration', 'line-through');

      const maxChars = Math.max(4, Math.floor((width - textX - 10) / 6.6));
      let display = label;
      if (display.length > maxChars) display = display.slice(0, maxChars - 1) + '…';
      text.textContent = display;

      const titleEl = document.createElementNS(svgNS,'title');
      titleEl.textContent = label;
      g.appendChild(titleEl);
      g.appendChild(text);
      svg.appendChild(g);
    }

    // Nodo raíz
    addNode(rootX, 0, MIN_ROOT_W, 'Organizador', {
      fill: 'var(--ink)',
      textColor: 'var(--paper)',
      fontFamily: "'Fraunces', serif",
      fontWeight: 600,
      fontSize: 14
    });

    catNodes.forEach(catNode => {
      const catY = LEVEL_H;
      const accent = accentFor(catNode.index);
      addLine(rootX, NODE_H, catNode.x, catY);
      addNode(catNode.x, catY, catNode.width, catNode.data.name, {
        dotColor: `var(--${accent})`,
        fontFamily: "'Fraunces', serif",
        fontWeight: 600,
        fontSize: 13.5,
        strokeWidth: 1.5,
        onClick: () => { currentView = 'list'; activeCategoryId = catNode.data.id; render(); }
      });

      catNode.children.forEach(objNode => {
        const objY = LEVEL_H*2;
        addLine(catNode.x, catY+NODE_H, objNode.x, objY);
        const total = objNode.data.tasks.length;
        const done = objNode.data.tasks.filter(t=>t.done).length;
        const allDone = total > 0 && done === total;
        addNode(objNode.x, objY, objNode.width, objNode.data.title + (total ? `  ${done}/${total}` : ''), {
          strike: allDone,
          textColor: allDone ? 'var(--ink-soft)' : 'var(--ink)'
        });

        objNode.children.forEach(taskNode => {
          const taskY = LEVEL_H*3;
          addLine(objNode.x, objY+NODE_H, taskNode.x, taskY);
          addNode(taskNode.x, taskY, taskNode.width, taskNode.data.text, {
            fill: taskNode.data.done ? 'var(--paper-dim)' : '#fff',
            strike: taskNode.data.done,
            textColor: taskNode.data.done ? 'var(--ink-soft)' : 'var(--ink)',
            fontSize: 11.5,
            onClick: () => focusTaskInList(catNode.data.id, objNode.data.id, taskNode.data.id)
          });
        });
      });
    });

    container.appendChild(svg);
  }

  function updateFooter(){
    const totalObjectives = state.categories.reduce((n,c) => n + c.objectives.length, 0);
    const totalTasks = state.categories.reduce((n,c) => n + c.objectives.reduce((m,o) => m + o.tasks.length, 0), 0);
    const doneTasks = state.categories.reduce((n,c) => n + c.objectives.reduce((m,o) => m + o.tasks.filter(t=>t.done).length, 0), 0);
    document.getElementById('footer-right').textContent =
      `${state.categories.length} categorías · ${totalObjectives} objetivos · ${doneTasks}/${totalTasks} tareas`;
  }

  // ---------- Arranque ----------
  (function init(){
    const codeFromUrl = getCodeFromUrl();
    if (codeFromUrl){
      document.getElementById('code-input').value = codeFromUrl;
      startWithCode(codeFromUrl);
    } else {
      showSetup();
    }
  })();

})();
</script>
</body>
